# 打 tag（v*）或手动运行时，把 skill/pastel-poster 打包成 zip 并发布到 Releases。
name: Release skill

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（如 v1.1）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package skill
        run: |
          cd skill
          zip -r ../pastel-poster.zip pastel-poster -x '*/__pycache__/*' '*.pyc'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" pastel-poster.zip --title "pastel-poster $TAG" --notes "下载 pastel-poster.zip，在 Claude 的技能设置里上传替换旧版本。" \
            || gh release upload "$TAG" pastel-poster.zip --clobber
